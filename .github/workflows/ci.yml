name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core — fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features save -- -D warnings
      - run: cargo test
      - run: cargo test --features images,typeset

  dco:
    name: every commit of a pull request is signed off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Signed-off-by from the author on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=$(git log --no-merges --format='%H%x09%ae%x09%(trailers:key=Signed-off-by,valueonly,separator=%x20)%x09%s' "$BASE..$HEAD" |
            awk -F'\t' 'index($3, "<" $2 ">") == 0 { print substr($1, 1, 12) "  " $4 }')
          if [ -n "$missing" ]; then
            echo "These commits are not signed off by their author (see DCO and CONTRIBUTING.md):" >&2
            echo "$missing" >&2
            echo "To sign them off: git rebase --signoff $BASE && git push --force-with-lease" >&2
            exit 1
          fi

  tls:
    name: trust stays delegated to the OS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: No webpki roots in the tree
        run: |
          if cargo tree | grep -q webpki-roots; then
            echo "webpki-roots linked in: trust must stay with the OS store" >&2
            exit 1
          fi

  android:
    name: Android — the core cross-compiles and the app builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust and NDK
        run: |
          (cd android && rustup toolchain install)
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          test -n "$ndk" || { echo "no ndkVersion in android/app/build.gradle.kts" >&2; exit 1; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - name: The core links into a shared library for arm64
        run: sh android/core.sh "$RUNNER_TEMP/core" arm64-v8a
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: The app builds
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -Pabis=arm64-v8a
