name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: the tag names the version in Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
          test -f "packaging/notes/v$version.md" ||
            { echo "::error::no packaging/notes/v$version.md"; exit 1; }

  android:
    name: Android — APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust and NDK
        run: |
          (cd android && rustup toolchain install)
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          test -n "$ndk" || { echo "::error::no ndkVersion in android/app/build.gradle.kts" >&2; exit 1; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: The signing key from the secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are not set"
            exit 1
          fi
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          printf '%s' "$KEYSTORE" | base64 -d > "$dir/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=brevier\n' \
            "$dir/release.jks" "$PASSWORD" > "$dir/release.properties"
          echo "BREVIER_SIGNING=$dir/release.properties" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Check the APK contains only arm64-v8a native code
        run: |
          python3 - <<'PY'
          from glob import glob
          from zipfile import ZipFile

          apks = glob("android/app/build/outputs/apk/release/brevier-*.apk")
          if len(apks) != 1:
              raise SystemExit(f"expected one release APK, found {len(apks)}")
          with ZipFile(apks[0]) as apk:
              abis = {
                  name.split("/")[1]
                  for name in apk.namelist()
                  if name.startswith("lib/") and len(name.split("/")) > 2
              }
          if abis != {"arm64-v8a"}:
              raise SystemExit(f"expected only arm64-v8a native code, found {sorted(abis)}")
          print(f"{apks[0]} contains only arm64-v8a native code")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/brevier-*.apk
          if-no-files-found: error

  reproducible:
    name: Android — the APK builds the same elsewhere
    needs: android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elsewhere/brevier
    steps:
      - uses: actions/checkout@v4
        with:
          path: elsewhere/brevier
      - name: Install the pinned Rust and NDK
        run: |
          (cd android && rustup toolchain install)
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          test -n "$ndk" || { echo "::error::no ndkVersion in android/app/build.gradle.kts" >&2; exit 1; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
      - name: Another home for cargo
        run: echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the APK unsigned
        working-directory: elsewhere/brevier/android
        run: ./gradlew --no-daemon assembleRelease -Punsigned
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/signed
      - name: Our signature fits the unsigned build
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet apksigcopier
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          PATH="$tools:$PATH" "$RUNNER_TEMP/venv/bin/apksigcopier" compare \
            "$RUNNER_TEMP"/signed/brevier-*.apk \
            --unsigned android/app/build/outputs/apk/release/brevier-*-unsigned.apk

  publish:
    name: publish the Android release
    needs: [version, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum *.apk > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Brevier $VERSION" \
            --notes-file "packaging/notes/v$VERSION.md" \
            --latest

  site:
    name: rebuild the project website
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
