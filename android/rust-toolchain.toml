# Rust для ядра под Android — закреплённый, а не `stable`: другой rustc
# соберёт другую библиотеку, а CI проверяет воспроизводимость APK. Файл
# читает rustup: `core.sh` зовёт cargo
# из этого каталога. Десктоп и CI-проверки ядра идут на `stable`, как и шли.
[toolchain]
channel = "1.98.1"
profile = "minimal"
targets = ["aarch64-linux-android", "x86_64-linux-android"]
