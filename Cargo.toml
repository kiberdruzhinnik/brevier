[package]
name = "brevier"
version = "0.19.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
description = "A browser for reading: it turns a page into clean text on your own computer and sets it in the typography you chose, without JavaScript"
repository = "https://github.com/gurov/brevier"
homepage = "https://brevier.bizibah.com/"
readme = "README.md"
publish = false
keywords = ["browser", "reader", "readability", "markdown"]
categories = ["command-line-utilities", "text-processing"]
# Core and internal CLI sources stay in the repository; end-user distribution
# is the Android app, built from `android/`.
exclude = [
    "/corpus",
    "/fuzz",
    "/android",
    "/site",
    "/packaging",
    "/fastlane",
    "/.github",
    "/assets/screenshot-*",
    "/assets/brevier.jpeg",
]

# Ядро — библиотека, Android и внутренний cli — потребители.
[lib]
name = "brevier"
path = "src/lib.rs"

[[bin]]
name = "brevier"
path = "src/main.rs"

# Тракт окна и телефона на странице с диска — для `corpus/frozen.py`.
# Example, not a binary target: it supports offline layout checks.
[[example]]
name = "lay"
required-features = ["typeset", "images"]

[features]
# Типографика окна: переносы по языку. Отдельной фичей — cli и корпус
# в ней не нуждаются, а паттерны переносов лишний вес в их бинарнике.
typeset = ["dep:hyphenation"]
# Декодеры картинок. Отдельной фичей, потому что корпус M0 гоняется
# бинарником `brevier` и лишние крейты ему ни к чему.
images = ["dep:image", "dep:resvg"]
# Сохранение статьи на диск: markdown, а с картинками — zip. Картинки тянет
# за собой: в архив они ложатся байтами, а искать их адреса умеет `media`.
save = ["dep:zip", "images"]

[dependencies]
# Страница, что кодировку не назвала, — по статистике, как в Firefox (#32):
# детектор того же автора, что `encoding_rs`, и поверх него же.
chardetng = "1.0"
comrak = { version = "0.55", default-features = false }
dom_query = "0.28"
dom_smoothie = "0.18.2"
# Лента в чужой кодировке (koi8-r, cp1251 в объявлении XML): тот же крейт,
# которым `ureq` перекодирует страницы, — в сборке он и так есть.
encoding_rs = "0.8"
htmd = "0.5.5"
# Архив прочитанного (#8): LZ4 стандартным кадром, чтобы копию открывал
# обычный `lz4 -d`. Чистый Rust и без `unsafe` (`safe-*`) — по той же
# причине, по которой нет SQLite.
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "frame", "checked-decode"] }
hyphenation = { version = "0.8", optional = true, default-features = false, features = ["embed_en-us"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
pdf-extract = { version = "0.12.1", default-features = false }
resvg = { version = "0.48.1", optional = true }
# Ленты RSS и Atom: разбор XML без зависимостей. Та же версия, что тянет `resvg`.
roxmltree = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip", "brotli"] }
url = "2.5.8"
zip = { version = "9", default-features = false, features = ["deflate-flate2"], optional = true }

# Android: ядро едет в приложение общей библиотекой и разговаривает с ним
# по JNI. Версию `jni` держим ту же, что тянет платформенный проверяющий
# сертификаты, — иначе `Env` у них окажется разным типом. Обеих зависимостей
# на десктопе нет вовсе: цель отсекает их раньше, чем фича.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"
